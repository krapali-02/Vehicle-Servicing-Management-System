{% extends 'base.html' %}

{% block title %}Add New Vehicle - VCMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="fw-bold mb-0"><i class="bi bi-plus-circle me-2"></i>Add New Vehicle</h4>
                <small class="text-white-50">Enter your vehicle details for service bookings</small>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('add_vehicle') }}" method="POST">
                    <div class="mb-3">
                        <label for="registration_no" class="form-label fw-semibold">Registration Number</label>
                        <input type="text" id="registration_no" name="registration_no" class="form-control" placeholder="e.g. MH-12-AB-1234" required>
                    </div>
                    <div class="mb-3">
                        <label for="model" class="form-label fw-semibold">Vehicle Model</label>
                        <input type="text" id="model" name="model" class="form-control" placeholder="e.g. Honda City / Hyundai Creta" required>
                    </div>
                    <div class="mb-3">
                        <label for="type" class="form-label fw-semibold">Vehicle Type</label>
                        <select id="type" name="type" class="form-select" required>
                            <option value="Car" selected>Car</option>
                            <option value="Bike">Bike</option>
                            <option value="SUV">SUV</option>
                            <option value="Scooter">Scooter</option>
                            <option value="Truck">Truck</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="year" class="form-label fw-semibold">Manufacturing/Purchase Year</label>
                        <input type="text" id="year" name="year" class="form-control" placeholder="e.g. 2023">
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('customer_vehicles') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary fw-bold px-4 shadow-sm">
                            <i class="bi bi-check-circle-fill me-1"></i> Save Vehicle
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
